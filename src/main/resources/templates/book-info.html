<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${book.title}">Book Information</title>
    <link rel="stylesheet" th:href="@{/css/info.css}">
</head>
<body>
<header>
    <div class="header-nav">
        <a th:href="@{/}" style="text-decoration:none; color:inherit;">Home</a>
        <a th:href="@{/books/export}" style="text-decoration:none; color:inherit;">Export list of books</a>
        <a th:href="@{/authors}" style="text-decoration:none; color:inherit;">Authors</a>
        <a th:href="@{/books}" style="text-decoration:none; color:inherit;">Books</a>
        <form th:action="@{/logout}" method="post" style="display:inline; margin:0;">
            <button type="submit" style="background:none; border:none; cursor:pointer; font-family:'Modern Antiqua',serif; font-size:20px; color:#392318; padding:0;">Log out</button>
        </form>
        <a th:href="@{/profile}"><img th:src="@{/img/acc-symbol-brown.png}" class="header-nav-img"></a>
    </div>
    <div>
        <h1 th:text="${book.title}">Book Title</h1>
    </div>
</header>

<div class="divider"></div>

<div class="info-box">
    <div>
        <img th:src="${book.coverImage != null ? '/img/books/' + book.coverImage : '/img/books/placeholder.png'}" th:alt="${book.title}">
    </div>
    <div class="description">
        <h2>Author <span style="color: #484848;" th:text="${book.author != null ? book.author.name : 'Unknown'}">Author Name</span></h2>
        <h2>Genre <span style="color: #484848;" th:text="${book.genre != null ? book.genre : '—'}">Genre</span></h2>
        <h2>Year <span style="color: #484848;" th:text="${book.year != null ? book.year : '—'}">Year</span></h2>
        <h2>Description</h2>
        <p th:text="${book.description != null ? book.description : 'No description available.'}">No description available.</p>
        <div>
            <a th:href="@{/books/edit/{id}(id=${book.id})}">
                <button class="button">Update info</button>
            </a>
            <form th:action="@{/books/delete/{id}(id=${book.id})}" method="post" style="display:inline;">
                <button class="button" type="submit"
                        onclick="return confirm('Are you sure you want to delete this book?')">Delete book</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
