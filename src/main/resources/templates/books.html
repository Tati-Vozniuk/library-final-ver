<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All books</title>
    <link rel="stylesheet" th:href="@{/css/all-author-book.css}">
</head>
<body>
<header>
    <div class="header-nav">
        <a th:href="@{/}" style="text-decoration:none; color:inherit;">Home</a>
        <a th:href="@{/books/export}" style="text-decoration:none; color:inherit;">Export list of books</a>
        <a th:href="@{/authors}" style="text-decoration:none; color:inherit;">Authors</a>
        <a th:href="@{/books}" style="text-decoration:none; color:inherit;">Books</a>
        <form th:action="@{/logout}" method="post" style="display:inline; margin:0;">
            <button type="submit" style="background:none; border:none; cursor:pointer; font-family:'Modern Antiqua',serif; font-size:20px; color:#392318; padding:0;">Log out</button>
        </form>
        <a th:href="@{/profile}"><img th:src="@{/img/acc-symbol-brown.png}" class="header-nav-img"></a>
    </div>
    <div>
        <h1>All books</h1>
    </div>
</header>

<div class="divider"></div>

<div class="control">
    <form th:action="@{/books}" method="get" style="display:inline;">
        <input type="hidden" name="filterType" value="title">
        <input type="text" name="search"
               class="control-element"
               th:value="${filterType == 'title' ? search : ''}"
               placeholder="Filter by title..."
               style="padding:8px 16px; border:2px solid #392318; border-radius: 6px; background:#8B9BA7; color:#392318;">
        <button class="control-element" type="submit" style="background:none; border:2px solid #392318; border-radius: 6px; padding:8px 26px; cursor:pointer; color:#392318;">Filter by title</button>
    </form>

    <form th:action="@{/books}" method="get" style="display:inline;">
        <input type="hidden" name="filterType" value="author">
        <input type="text" name="search"
               th:value="${filterType == 'author' ? search : ''}"
               placeholder="Filter by author..."
               class="control-element"
               style="padding:8px 16px; border:2px solid #392318; border-radius: 6px; background:#8B9BA7; color:#392318;">
        <button type="submit" class="control-element" style="background:none; border:2px solid #392318; border-radius: 6px; padding:8px 26px; cursor:pointer; color:#392318;">Filter by author</button>
    </form>

    <a th:href="@{/books/new}" style="text-decoration:none;" class="add-new">
        Add new book
    </a>
</div>



<div class="books">
    <div th:each="book : ${books}">
        <img th:src="${book.coverImage != null ? '/img/books/' + book.coverImage : '/img/books/placeholder.png'}" alt="book cover">
        <a th:href="@{/books/{id}(id=${book.id})}" style="text-decoration:none;">
            <p th:text="${book.title + ' →'}">Learn more -></p>
        </a>
    </div>
    <div th:if="${#lists.isEmpty(books)}">
        <p style="font-family:'Modern Antiqua',serif; color:#484848; font-size:25px; margin-left:55px;">No books found.</p>
    </div>
</div>

</body>
</html>
